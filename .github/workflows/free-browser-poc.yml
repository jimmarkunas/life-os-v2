name: Free Browser Engines POC

on:
  push:
    branches:
      - poc/free-browser-engines

permissions:
  contents: read

jobs:
  browser-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOBRIGHT_URL: https://jobright.ai/jobs/info/6a63af088d53603449603a5e
      LENSA_PUBLIC_URL: https://lensa.com/job-v1/blenderbox/remote/senior-digital-project-manager/3e18abacaaf87e0ef9eb0a11b7b5b772
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create result directory
        run: mkdir -p /tmp/browser-poc

      - name: Patchright POC
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m venv /tmp/patchright-venv
          /tmp/patchright-venv/bin/pip install --disable-pip-version-check -q patchright
          /tmp/patchright-venv/bin/patchright install chromium
          /tmp/patchright-venv/bin/python - <<'PY'
          import json, os, time, traceback
          from patchright.sync_api import sync_playwright

          targets = {
              "jobright": os.environ["JOBRIGHT_URL"],
              "lensa_public": os.environ["LENSA_PUBLIC_URL"],
          }

          def inspect(page, name, url):
              started=time.time()
              out={"target":name,"requested_host":url.split('/')[2],"status":"FAIL"}
              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=30000)
                  page.wait_for_timeout(6000)
                  body=(page.locator("body").inner_text(timeout=5000) or "")
                  hrefs=page.locator("a").evaluate_all("els => els.map(a => a.href).filter(Boolean)")
                  low=body.casefold()
                  out.update({
                      "status":"PASS",
                      "final_host":page.url.split('/')[2] if '://' in page.url else page.url,
                      "title":page.title(),
                      "body_chars":len(body),
                      "webdriver":page.evaluate("navigator.webdriver"),
                      "original_job_post":("original job post" in low),
                      "greenhouse_href":next((h for h in hrefs if "greenhouse.io" in h), None),
                      "jobright_href":next((h for h in hrefs if "jobright.ai" in h), None),
                      "challenge":("just a moment" in page.title().casefold() or "verify you are human" in low or "checking your browser" in low),
                  })
              except Exception as exc:
                  out.update({"error":type(exc).__name__,"detail":str(exc)[:300]})
              out["elapsed_seconds"]=round(time.time()-started,2)
              return out

          results=[]
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True)
                  context=browser.new_context(locale="en-US", timezone_id="America/Chicago", viewport={"width":1365,"height":768})
                  for name,url in targets.items():
                      page=context.new_page()
                      results.append(inspect(page,name,url))
                      page.close()
                  browser.close()
          except Exception as exc:
              results.append({"target":"engine","status":"FAIL","error":type(exc).__name__,"detail":str(exc)[:300]})
          payload={"engine":"patchright","results":results}
          print(json.dumps(payload, indent=2))
          open('/tmp/browser-poc/patchright.json','w').write(json.dumps(payload, indent=2))
          PY
          exit 0

      - name: Camoufox POC
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m venv /tmp/camoufox-venv
          /tmp/camoufox-venv/bin/pip install --disable-pip-version-check -q 'camoufox[geoip]'
          /tmp/camoufox-venv/bin/python -m camoufox fetch
          /tmp/camoufox-venv/bin/python - <<'PY'
          import json, os, time
          from camoufox.sync_api import Camoufox

          targets = {
              "jobright": os.environ["JOBRIGHT_URL"],
              "lensa_public": os.environ["LENSA_PUBLIC_URL"],
          }

          def inspect(page, name, url):
              started=time.time(); out={"target":name,"requested_host":url.split('/')[2],"status":"FAIL"}
              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=30000)
                  page.wait_for_timeout(6000)
                  body=(page.locator("body").inner_text(timeout=5000) or "")
                  hrefs=page.locator("a").evaluate_all("els => els.map(a => a.href).filter(Boolean)")
                  low=body.casefold()
                  out.update({
                      "status":"PASS",
                      "final_host":page.url.split('/')[2] if '://' in page.url else page.url,
                      "title":page.title(),
                      "body_chars":len(body),
                      "webdriver":page.evaluate("navigator.webdriver"),
                      "original_job_post":("original job post" in low),
                      "greenhouse_href":next((h for h in hrefs if "greenhouse.io" in h), None),
                      "jobright_href":next((h for h in hrefs if "jobright.ai" in h), None),
                      "challenge":("just a moment" in page.title().casefold() or "verify you are human" in low or "checking your browser" in low),
                  })
              except Exception as exc:
                  out.update({"error":type(exc).__name__,"detail":str(exc)[:300]})
              out["elapsed_seconds"]=round(time.time()-started,2)
              return out

          results=[]
          try:
              with Camoufox(headless=True, geoip=False) as browser:
                  for name,url in targets.items():
                      page=browser.new_page()
                      results.append(inspect(page,name,url))
                      page.close()
          except Exception as exc:
              results.append({"target":"engine","status":"FAIL","error":type(exc).__name__,"detail":str(exc)[:300]})
          payload={"engine":"camoufox","results":results}
          print(json.dumps(payload, indent=2))
          open('/tmp/browser-poc/camoufox.json','w').write(json.dumps(payload, indent=2))
          PY
          exit 0

      - name: Rayobrowse POC
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git clone --depth 1 https://github.com/rayobyte-data/rayobrowse.git /tmp/rayobrowse
          cd /tmp/rayobrowse
          docker compose up -d
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9222/health && break; sleep 2; done
          python -m venv /tmp/rayobrowse-venv
          /tmp/rayobrowse-venv/bin/pip install --disable-pip-version-check -q httpx playwright
          /tmp/rayobrowse-venv/bin/python - <<'PY'
          import json, os, time
          import httpx
          from playwright.sync_api import sync_playwright

          targets = {
              "jobright": os.environ["JOBRIGHT_URL"],
              "lensa_public": os.environ["LENSA_PUBLIC_URL"],
          }

          def inspect(page, name, url):
              started=time.time(); out={"target":name,"requested_host":url.split('/')[2],"status":"FAIL"}
              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=30000)
                  page.wait_for_timeout(6000)
                  body=(page.locator("body").inner_text(timeout=5000) or "")
                  hrefs=page.locator("a").evaluate_all("els => els.map(a => a.href).filter(Boolean)")
                  low=body.casefold()
                  out.update({
                      "status":"PASS",
                      "final_host":page.url.split('/')[2] if '://' in page.url else page.url,
                      "title":page.title(),
                      "body_chars":len(body),
                      "webdriver":page.evaluate("navigator.webdriver"),
                      "original_job_post":("original job post" in low),
                      "greenhouse_href":next((h for h in hrefs if "greenhouse.io" in h), None),
                      "jobright_href":next((h for h in hrefs if "jobright.ai" in h), None),
                      "challenge":("just a moment" in page.title().casefold() or "verify you are human" in low or "checking your browser" in low),
                  })
              except Exception as exc:
                  out.update({"error":type(exc).__name__,"detail":str(exc)[:300]})
              out["elapsed_seconds"]=round(time.time()-started,2)
              return out

          results=[]
          try:
              r=httpx.get("http://127.0.0.1:9222/connect", params={"os":"windows","headless":"false","vnc":"false","maxLifetime":"120"}, timeout=120)
              r.raise_for_status(); cdp=r.text.strip()
              with sync_playwright() as p:
                  browser=p.chromium.connect_over_cdp(cdp)
                  context=browser.contexts[0] if browser.contexts else browser.new_context()
                  for name,url in targets.items():
                      page=context.new_page()
                      results.append(inspect(page,name,url))
                      page.close()
                  browser.close()
          except Exception as exc:
              results.append({"target":"engine","status":"FAIL","error":type(exc).__name__,"detail":str(exc)[:300]})
          payload={"engine":"rayobrowse","results":results}
          print(json.dumps(payload, indent=2))
          open('/tmp/browser-poc/rayobrowse.json','w').write(json.dumps(payload, indent=2))
          PY
          docker compose down -v || true
          exit 0

      - name: Summarize POC
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          engines=['patchright','camoufox','rayobrowse']
          print('ENGINE\tTARGET\tLOAD\tCHALLENGE\tORIGINAL_POST\tGREENHOUSE\tJOBRIGHT_HREF\tWEBDRIVER\tSECONDS')
          for engine in engines:
              path=pathlib.Path(f'/tmp/browser-poc/{engine}.json')
              if not path.exists():
                  print(f'{engine}\tengine\tMISSING')
                  continue
              data=json.loads(path.read_text())
              for r in data.get('results',[]):
                  print('\t'.join(map(str,[
                      engine,
                      r.get('target'),
                      r.get('status'),
                      r.get('challenge'),
                      r.get('original_job_post'),
                      bool(r.get('greenhouse_href')),
                      bool(r.get('jobright_href')),
                      r.get('webdriver'),
                      r.get('elapsed_seconds'),
                  ])))
          PY
