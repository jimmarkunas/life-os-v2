name: CI
# Keep the existing pull_request check discoverable for every PR synchronization.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Leak guard and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest playwright

      - name: One-shot R0-1C8 Playwright Chrome acceptance
        if: github.event_name == 'pull_request'
        run: |
          xvfb-run -a python - <<'PY'
          import base64, json, time
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          sources = {
              "JOBRIGHT": base64.b64decode('').decode(),
              "LENSA": base64.b64decode('aHR0cHM6Ly9sZW5zYS5jb20vY2d3LzJmNTVlYWQ4MzcwMTRkMmJhOWIzNjc1ZTdlNGY0ZWExdHBzam8xP2pwc2k9am9icmlnaHQuYWk=').decode(),
          }
          with sync_playwright() as pw:
            browser=pw.chromium.launch(channel='chrome',headless=False,args=['--no-sandbox','--disable-dev-shm-usage']); context=browser.new_context(); page=context.new_page()
            for label, source in sources.items():
              started=time.monotonic(); result={"url":"NONE","title":"NONE","original":0,"ats":0,"failure":"NONE"}
              try:
                  page.goto(source,wait_until='domcontentloaded',timeout=15000); result["url"]=urlsplit(page.url).netloc+urlsplit(page.url).path; result["title"]=page.title(); page.wait_for_timeout(8000); result["original"]=page.get_by_text('Original Job Post',exact=False).count()+page.get_by_text('Original Job Posting',exact=False).count(); result["ats"]=page.locator('a[href*="job-boards.greenhouse.io"]').count()
                  if not result["original"]: result["failure"]='ORIGINAL_POST_MISSING'
                  elif not result["ats"]: result["failure"]='ATS_HREF_MISSING'
              except Exception as exc: result["failure"]=type(exc).__name__
              print(label,json.dumps(result),f"elapsed={time.monotonic()-started:.2f}s")
            browser.close()
          PY






      - name: Development efficiency guard
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci/development_guard.py

      - name: Leak guard
        run: python scripts/security/leak_guard.py

      - name: Commit metadata guard
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/agent/'))
        run: python scripts/security/commit_metadata_guard.py HEAD

      - name: Unit tests
        run: python -m pytest -q
