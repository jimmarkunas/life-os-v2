name: CI
# Keep the existing pull_request check discoverable for every PR synchronization.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Leak guard and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: One-shot R0-1C4 live acceptance
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import base64, shutil, time
          from lifeos.core.runtime import RunContext
          from lifeos.jobs.terminal_evidence import ChromeFetcher, _extract_terminal_description, resolve_final_vacancy_url
          sources = {
              "JOBRIGHT": "",
              "LENSA": "aHR0cHM6Ly9sZW5zYS5jb20vY2d3LzJmNTVlYWQ4MzcwMTRkMmJhOWIzNjc1ZTdlNGY0ZWExdHBzam8xP2pwc2k9am9icmlnaHQuYWk=",
          }
          for label, encoded in sources.items():
              start = time.monotonic(); result = {"browser": False, "condition": False, "ats": False, "jd": False, "failure": "NONE"}
              try:
                  fetcher = ChromeFetcher(RunContext.start(timeout_seconds=45)); result["browser"] = fetcher.available
                  if not result["browser"]: result["failure"] = "CHROMIUM_UNAVAILABLE"
                  else:
                      resolved = resolve_final_vacancy_url(base64.b64decode(encoded).decode(), fetcher=fetcher)
                      body = resolved.verified_body or ""; result["condition"] = bool(resolved.verified_body); result["ats"] = "job-boards.greenhouse.io" in body
                      if resolved.final_url and "greenhouse.io" in resolved.final_url:
                          terminal = body or fetcher.get(resolved.final_url).body; result["jd"] = bool(_extract_terminal_description(terminal))
                      if not result["condition"]: result["failure"] = "CONDITION_OR_RESOLUTION"
                      elif not result["ats"]: result["failure"] = "ATS_HREF_MISSING"
                      elif not result["jd"]: result["failure"] = "JD_MISSING"
              except Exception as exc: result["failure"] = type(exc).__name__
              print(label, result, f"elapsed={time.monotonic()-start:.2f}s")
          PY

      - name: Development efficiency guard
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci/development_guard.py

      - name: Leak guard
        run: python scripts/security/leak_guard.py

      - name: Commit metadata guard
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/agent/'))
        run: python scripts/security/commit_metadata_guard.py HEAD

      - name: Unit tests
        run: python -m pytest -q
