name: CI
# Keep the existing pull_request check discoverable for every PR synchronization.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Leak guard and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: One-shot R0-1C5R2 hardened diagnostic
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import base64, json, os, re, shutil, subprocess, tempfile, time, urllib.request
          from urllib.error import HTTPError
          from urllib.parse import urlparse
          from lifeos.jobs.terminal_evidence import _DevToolsSocket
          J=base64.b64decode('').decode(); L=base64.b64decode('aHR0cHM6Ly9sZW5zYS5jb20vY2d3LzJmNTVlYWQ4MzcwMTRkMmJhOWIzNjc1ZTdlNGY0ZWExdHBzam8xP2pwc2k9am9icmlnaHQuYWk=').decode()
          def shape(v):
              p=urlparse(v); return p.netloc+(p.path or '/')
          def field(name, expr, cdp, sid):
              try:
                  r=cdp.command('Runtime.evaluate',{'expression':expr,'returnByValue':True},session_id=sid); result=r.get('result',{}); inner=result.get('result',{})
                  if 'exceptionDetails' in result: return {'field':name,'status':'JS_EXCEPTION','value':None}
                  if 'value' not in inner: return {'field':name,'status':'NO_VALUE','value':None}
                  value=inner['value'];
                  if name=='location': value=shape(value)
                  if name=='body_prefix': value=re.sub(r'https?://\\S+','[URL]',str(value))[:2000]
                  return {'field':name,'status':'PASS','value':value}
              except Exception as e: return {'field':name,'status':'CDP_ERROR','value':type(e).__name__}
          binary=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium') or shutil.which('chromium-browser')
          def jobright():
              records=[]; profile=tempfile.mkdtemp(prefix='r0-1c5r2-'); proc=subprocess.Popen([binary,'--headless=new','--no-sandbox','--disable-gpu','--remote-debugging-port=0','--remote-allow-origins=*','--user-data-dir='+profile,'about:blank'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              try:
                  active=os.path.join(profile,'DevToolsActivePort'); end=time.monotonic()+10; lines=[]
                  while time.monotonic()<end:
                      try: lines=open(active).read().splitlines()
                      except Exception: lines=[]
                      if len(lines)>=2: break
                      time.sleep(.1)
                  if len(lines)<2: return [{'field':'transport','status':'CDP_ERROR','value':'DevToolsActivePort'}]
                  with _DevToolsSocket(f'ws://127.0.0.1:{int(lines[0])}{lines[1]}') as cdp:
                      infos=cdp.command('Target.getTargets').get('result',{}).get('targetInfos',[]); page=next((x for x in infos if x.get('type')=='page'),None)
                      if not page: page={'targetId':cdp.command('Target.createTarget',{'url':'about:blank'}).get('result',{}).get('targetId')}
                      sid=cdp.command('Target.attachToTarget',{'targetId':page['targetId'],'flatten':True}).get('result',{}).get('sessionId')
                      cdp.command('Runtime.enable',session_id=sid); cdp.command('Page.enable',session_id=sid); cdp.command('Page.navigate',{'url':J},session_id=sid)
                      time.sleep(8)
                      exprs={'location':'location.href','title':'document.title','ready':'document.readyState','dom_bytes':'document.documentElement.outerHTML.length','body_prefix':'document.body ? document.body.innerText.slice(0,2000) : ""','original_post':'!!(document.body && document.body.innerText.includes("Original Job Post"))','original_posting':'!!(document.body && document.body.innerText.includes("Original Job Posting"))','greenhouse':'document.documentElement.outerHTML.includes("greenhouse")','webdriver':'navigator.webdriver','user_agent':'navigator.userAgent','viewport':'[innerWidth,innerHeight]','cookie_names':'document.cookie.split(";").filter(Boolean).map(x=>x.split("=")[0])','local_keys':'Object.keys(localStorage)','session_keys':'Object.keys(sessionStorage)'}
                      records=[field(n,e,cdp,sid) for n,e in exprs.items()]
              except Exception as e: records.append({'field':'transport','status':'CDP_ERROR','value':type(e).__name__})
              finally: proc.terminate(); proc.wait(timeout=3); shutil.rmtree(profile,ignore_errors=True)
              return records
          print('JOBRIGHT_DIAGNOSTIC',json.dumps(jobright()))
          try:
              r=urllib.request.urlopen(L,timeout=15); b=r.read(); t=b.decode(errors='ignore'); hits=re.findall(r'https?://[^"\'<>\\ ]+',t,re.I); print('LENSA_DIAGNOSTIC',json.dumps({'status':r.status,'final':shape(r.geturl()),'content_type':r.headers.get_content_type(),'bytes':len(b),'jobright_raw':'jobright.ai' in t.lower(),'candidates':[shape(x) for x in hits if 'jobright.ai' in x.lower()][:10]}))
          except HTTPError as e:
              body=e.read(); print('LENSA_DIAGNOSTIC',json.dumps({'status':e.code,'final':shape(e.geturl()),'content_type':e.headers.get_content_type(),'bytes':len(body),'jobright_raw':'jobright.ai' in body.decode(errors='ignore').lower()}))
          except Exception as e: print('LENSA_DIAGNOSTIC',json.dumps({'status':'ERROR','error':type(e).__name__}))
          PY





      - name: Development efficiency guard
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci/development_guard.py

      - name: Leak guard
        run: python scripts/security/leak_guard.py

      - name: Commit metadata guard
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/agent/'))
        run: python scripts/security/commit_metadata_guard.py HEAD

      - name: Unit tests
        run: python -m pytest -q
