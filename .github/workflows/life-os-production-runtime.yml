name: LIFE OS Production Runtime

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Scheduled slot (ISO 8601 with offset)
        required: true
        type: string
      module:
        description: Runtime module
        required: true
        type: choice
        options:
          - us-remote
          - us-remote-recovery
          - scale-up
      window_hours:
        description: Optional source window override
        required: false
        type: string
      historical_inbox_recovery_hours:
        description: Optional bounded historical Inbox recovery window
        required: false
        type: string
      nonce:
        description: Unique run nonce
        required: true
        type: string
  issue_comment:
    types: [edited]

permissions:
  contents: read

concurrency:
  group: life-os-production-runtime
  cancel-in-progress: false

jobs:
  execute:
    name: Execute bounded LIFE OS runtime
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 12 &&
       github.event.comment.id == 5756076786)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: 1
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_JOB_LEDGER_DATA_SOURCE_ID: ${{ secrets.NOTION_JOB_LEDGER_DATA_SOURCE_ID }}
      SCALE_UP_RECOVERY_EVIDENCE_JSON: ${{ secrets.SCALE_UP_RECOVERY_EVIDENCE_JSON }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate trigger
        id: trigger
        shell: bash
        env:
          DISPATCH_SLOT: ${{ inputs.slot }}
          DISPATCH_MODULE: ${{ inputs.module }}
          DISPATCH_WINDOW_HOURS: ${{ inputs.window_hours }}
          DISPATCH_HISTORICAL_INBOX_RECOVERY_HOURS: ${{ inputs.historical_inbox_recovery_hours }}
          DISPATCH_NONCE: ${{ inputs.nonce }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            first_line="$(printf '%s\n' "$COMMENT_BODY" | sed -n '1p')"
            test "$first_line" = "LIFE_OS_RUNTIME_TRIGGER v1"
            slot="$(printf '%s\n' "$COMMENT_BODY" | sed -n 's/^slot=//p' | head -n1)"
            module="$(printf '%s\n' "$COMMENT_BODY" | sed -n 's/^module=//p' | head -n1)"
            window_hours="$(printf '%s\n' "$COMMENT_BODY" | sed -n 's/^window_hours=//p' | head -n1)"
            historical_inbox_recovery_hours=""
            nonce="$(printf '%s\n' "$COMMENT_BODY" | sed -n 's/^nonce=//p' | head -n1)"
          else
            slot="$DISPATCH_SLOT"
            module="$DISPATCH_MODULE"
            window_hours="$DISPATCH_WINDOW_HOURS"
            historical_inbox_recovery_hours="$DISPATCH_HISTORICAL_INBOX_RECOVERY_HOURS"
            nonce="$DISPATCH_NONCE"
          fi

          test -n "$slot"
          test -n "$nonce"
          dry_run="false"
          case "$module" in
            us-remote)
              default_window="24"
              web_lookback_hours="24"
              full_web_sweep="false"
              ;;
            us-remote-recovery)
              default_window="1440"
              web_lookback_hours="24"
              full_web_sweep="true"
              ;;
            scale-up)
              default_window="24"
              web_lookback_hours="24"
              full_web_sweep="false"
              ;;
            *) echo "Unsupported module" >&2; exit 2 ;;
          esac
          if [ -z "$window_hours" ]; then window_hours="$default_window"; fi
          python - "$window_hours" <<'PY'
          import sys
          value = float(sys.argv[1])
          if not (0 < value <= 1440):
              raise SystemExit("window_hours must be in (0, 1440]")
          PY

          if [ -n "$historical_inbox_recovery_hours" ]; then
            if [ "$module" != "us-remote" ]; then
              echo "historical_inbox_recovery_hours is only permitted for module=us-remote" >&2
              exit 2
            fi
            python - "$historical_inbox_recovery_hours" <<'PY'
          import sys
          try:
              value = float(sys.argv[1])
          except ValueError:
              raise SystemExit("historical_inbox_recovery_hours must be numeric")
          if not (0 < value <= 2160):
              raise SystemExit("historical_inbox_recovery_hours must be in (0, 2160]")
          PY
          fi

          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "window_hours=$window_hours" >> "$GITHUB_OUTPUT"
          echo "web_lookback_hours=$web_lookback_hours" >> "$GITHUB_OUTPUT"
          echo "full_web_sweep=$full_web_sweep" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "historical_inbox_recovery_hours=$historical_inbox_recovery_hours" >> "$GITHUB_OUTPUT"
          echo "nonce=$nonce" >> "$GITHUB_OUTPUT"

      - name: Verify headless browser fallback
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null || \
          command -v google-chrome-stable >/dev/null || \
          command -v chromium >/dev/null || \
          command -v chromium-browser >/dev/null

      - name: Execute US Remote runtime
        if: steps.trigger.outputs.module != 'scale-up'
        env:
          SCHEDULED_SLOT: ${{ steps.trigger.outputs.slot }}
          TRIGGER_NONCE: ${{ steps.trigger.outputs.nonce }}
        run: |
          set -euo pipefail
          started="$(date +%s)"
          extra=()
          if [ "${{ steps.trigger.outputs.full_web_sweep }}" = "true" ]; then
            extra+=(--full-web-sweep)
          fi
          if [ "${{ steps.trigger.outputs.dry_run }}" = "true" ]; then
            extra+=(--dry-run)
          fi
          if [ -n "${{ steps.trigger.outputs.historical_inbox_recovery_hours }}" ]; then
            extra+=(--historical-inbox-recovery-hours "${{ steps.trigger.outputs.historical_inbox_recovery_hours }}")
          fi
          PYTHONPATH="$GITHUB_WORKSPACE" python3.12 scripts/run_us_remote_production.py \
            --timeout-seconds 300 \
            --window-hours "${{ steps.trigger.outputs.window_hours }}" \
            --web-lookback-hours "${{ steps.trigger.outputs.web_lookback_hours }}" \
            "${extra[@]}"
          finished="$(date +%s)"
          elapsed="$((finished-started))"
          echo "LIFE OS runtime complete: module=${{ steps.trigger.outputs.module }} slot=${SCHEDULED_SLOT} elapsed_seconds=${elapsed}"
          if [ "$elapsed" -gt 45 ]; then
            echo "::warning::Runtime exceeded 45-second benchmark: ${elapsed}s"
          fi

      - name: Execute Scale-Up runtime
        if: steps.trigger.outputs.module == 'scale-up'
        env:
          SCHEDULED_SLOT: ${{ steps.trigger.outputs.slot }}
          TRIGGER_NONCE: ${{ steps.trigger.outputs.nonce }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python3.12 scripts/run_scale_up_production.py --timeout-seconds 300
