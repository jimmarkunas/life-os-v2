name: R0-1C3 Live Acceptance (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JOBRIGHT_URL_B64: 
      LENSA_URL_B64: aHR0cHM6Ly9sZW5zYS5jb20vY2d3LzJmNTVlYWQ4MzcwMTRkMmJhOWIzNjc1ZTdlNGY0ZWExdHBzam8xP2pwc2k9am9icmlnaHQuYWk=
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Locate existing Chromium
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
      - name: Run sanitized live acceptance
        run: |
          python - <<'PY'
          import base64
          import os
          import shutil
          import time
          from lifeos.core.runtime import RunContext
          from lifeos.jobs.terminal_evidence import ChromeFetcher, _extract_terminal_description, resolve_final_vacancy_url

          def run(label, source):
              started = time.monotonic()
              result = {"browser": False, "hydrated": False, "original": False, "ats": False, "terminal": False, "jd": False, "first": "NONE"}
              try:
                  fetcher = ChromeFetcher(RunContext.start(timeout_seconds=45))
                  if not fetcher.available:
                      result["first"] = "CHROMIUM_UNAVAILABLE"
                      return result, time.monotonic() - started
                  result["browser"] = True
                  resolved = resolve_final_vacancy_url(source, fetcher=fetcher)
                  result["hydrated"] = bool(resolved.verified_body)
                  body = resolved.verified_body or ""
                  result["original"] = "Original Job Post" in body or "Original Job Posting" in body
                  result["ats"] = "job-boards.greenhouse.io" in body
                  result["terminal"] = bool(resolved.final_url and "greenhouse.io" in resolved.final_url)
                  if result["terminal"]:
                      terminal_body = body or fetcher.get(resolved.final_url).body
                      result["jd"] = bool(_extract_terminal_description(terminal_body))
                  if not result["hydrated"]: result["first"] = "HYDRATION_OR_RESOLUTION"
                  elif not result["ats"]: result["first"] = "ATS_HREF_MISSING"
                  elif not result["terminal"]: result["first"] = "TERMINAL_ATS_NOT_REACHED"
                  elif not result["jd"]: result["first"] = "JD_MISSING"
              except Exception as exc:
                  result["first"] = type(exc).__name__
              return result, time.monotonic() - started

          for label, key in (("JOBRIGHT", "JOBRIGHT_URL_B64"), ("LENSA", "LENSA_URL_B64")):
              source = base64.b64decode(os.environ[key]).decode()
              result, elapsed = run(label, source)
              print(f"{label}: browser access={'PASS' if result['browser'] else 'FAIL'} hydrated DOM={'YES' if result['hydrated'] else 'NO'} original={'YES' if result['original'] else 'NO'} ATS href={'YES' if result['ats'] else 'NO'} terminal ATS={'YES' if result['terminal'] else 'NO'} JD={'YES' if result['jd'] else 'NO'} elapsed={elapsed:.2f}s first failure={result['first']}")
          PY
