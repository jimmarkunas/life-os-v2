name: Cloudflare Browser Run POC

on:
  push:
    branches:
      - poc/free-browser-engines

permissions:
  contents: read

jobs:
  cloudflare-browser-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOBRIGHT_URL: https://jobright.ai/jobs/info/6a63af088d53603449603a5e
      LENSA_PUBLIC_URL: https://lensa.com/job-v1/blenderbox/remote/senior-digital-project-manager/3e18abacaaf87e0ef9eb0a11b7b5b772
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Cloudflare Browser Run live proof
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "POC_STATUS=CREDENTIALS_MISSING"
            exit 2
          fi

          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          endpoint = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/browser-rendering/content"
          targets = {
              "jobright": os.environ["JOBRIGHT_URL"],
              "lensa_public": os.environ["LENSA_PUBLIC_URL"],
          }

          def render(name, url):
              payload = json.dumps({
                  "url": url,
                  "gotoOptions": {"waitUntil": "networkidle2", "timeout": 60000},
                  "waitForTimeout": 8000,
              }).encode("utf-8")
              req = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              out = {"target": name, "requested_host": urlsplit(url).hostname, "status": "FAIL"}
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      html = response.read().decode("utf-8", errors="replace")
                  low = html.casefold()
                  hrefs = re.findall(r'''href=["']([^"']+)["']''', html, flags=re.I)
                  greenhouse = next((h for h in hrefs if "greenhouse.io" in h.casefold()), None)
                  jobright = next((h for h in hrefs if "jobright.ai" in h.casefold()), None)
                  out.update({
                      "status": "PASS",
                      "html_chars": len(html),
                      "original_job_post": "original job post" in low,
                      "greenhouse_href": bool(greenhouse),
                      "jobright_href": bool(jobright),
                      "challenge": any(marker in low for marker in (
                          "just a moment",
                          "verify you are human",
                          "checking your browser",
                      )),
                  })
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")[:500]
                  out.update({"error": f"HTTP_{exc.code}", "detail": detail})
              except Exception as exc:
                  out.update({"error": type(exc).__name__, "detail": str(exc)[:500]})
              return out

          results = [render(name, url) for name, url in targets.items()]
          print(json.dumps({"engine": "cloudflare_browser_run", "results": results}, indent=2))
          PY
