name: Newsletter Production UAT (Manual)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: newsletter-uat-manual
  cancel-in-progress: false

jobs:
  uat:
    name: Bounded Newsletter production UAT
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_JOB_LEDGER_DATA_SOURCE_ID: ${{ secrets.NOTION_JOB_LEDGER_DATA_SOURCE_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Newsletter production run
        run: >
          NEWSLETTER_PRIVATE_POLICY_PATH="$HOME/.config/life-os/newsletter-policy.json"
          PYTHONPATH="$GITHUB_WORKSPACE" /opt/homebrew/bin/python3.12
          scripts/run_newsletter_production.py
          --timeout-seconds 90
          --window-hours 24

      - name: Newsletter production replay (idempotency proof)
        run: >
          NEWSLETTER_PRIVATE_POLICY_PATH="$HOME/.config/life-os/newsletter-policy.json"
          PYTHONPATH="$GITHUB_WORKSPACE" /opt/homebrew/bin/python3.12
          scripts/run_newsletter_production.py
          --timeout-seconds 90
          --window-hours 24
