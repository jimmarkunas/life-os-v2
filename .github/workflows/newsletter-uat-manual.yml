name: Newsletter Production UAT (Manual)

on:
  workflow_dispatch:
    inputs:
      replay_idempotency:
        description: Run the idempotency replay after the production execution
        required: false
        type: boolean
        default: false
      diagnostic_mode:
        description: Run the temporary two-observation terminal resolver diagnostic only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: newsletter-uat-manual
  cancel-in-progress: false

jobs:
  uat:
    name: Bounded Newsletter production UAT
    if: github.ref == 'refs/heads/main' || inputs.diagnostic_mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_JOB_LEDGER_DATA_SOURCE_ID: ${{ secrets.NOTION_JOB_LEDGER_DATA_SOURCE_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.diagnostic_mode && github.ref_name || 'main' }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Newsletter production run
        if: ${{ !inputs.diagnostic_mode }}
        shell: bash
        run: |
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE" python3.12 \
            scripts/run_us_remote_production.py \
            --newsletter-only \
            --timeout-seconds 285 \
            --window-hours 24 | tee /tmp/newsletter-uat.json
          runtime_exit=${PIPESTATUS[0]}
          set -e
          python3.12 - /tmp/newsletter-uat.json "$runtime_exit" <<'PY'
          import json
          import sys

          path, runtime_exit = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              result = json.load(handle)

          mail = result.get("mail", {})
          newsletter = result.get("newsletter", {})
          jobs = result.get("jobs", {})

          failures = []
          if newsletter.get("state") != "PASS":
              failures.append(f"newsletter.state={newsletter.get('state')!r}")
          if mail.get("status") != "PASS":
              failures.append(f"mail.status={mail.get('status')!r}")
          if mail.get("cleanup_safe") is not True:
              failures.append(f"mail.cleanup_safe={mail.get('cleanup_safe')!r}")
          if mail.get("processed_errors") != 0:
              failures.append(f"mail.processed_errors={mail.get('processed_errors')!r}")
          if jobs.get("fully_accounted") is not True:
              failures.append(f"jobs.fully_accounted={jobs.get('fully_accounted')!r}")
          if runtime_exit != 0:
              failures.append(f"runtime_exit={runtime_exit}")

          if failures:
              print("Newsletter UAT FAIL: " + "; ".join(failures), file=sys.stderr)
              sys.exit(1)

          print("Newsletter UAT PASS: isolated Newsletter runtime and Newsletter/Mail acceptance boundary passed.")
          PY

      - name: Two-observation terminal resolver diagnostic
        if: ${{ inputs.diagnostic_mode }}
        run: PYTHONPATH="$GITHUB_WORKSPACE" python3.12 scripts/r0_1b_live_terminal_diagnostic.py

      - name: Newsletter production replay (idempotency proof)
        if: ${{ inputs.replay_idempotency && !inputs.diagnostic_mode }}
        shell: bash
        run: |
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE" python3.12 \
            scripts/run_us_remote_production.py \
            --newsletter-only \
            --timeout-seconds 285 \
            --window-hours 24 | tee /tmp/newsletter-uat-replay.json
          runtime_exit=${PIPESTATUS[0]}
          set -e
          python3.12 - /tmp/newsletter-uat-replay.json "$runtime_exit" <<'PY'
          import json
          import sys

          path, runtime_exit = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              result = json.load(handle)

          mail = result.get("mail", {})
          newsletter = result.get("newsletter", {})
          jobs = result.get("jobs", {})

          failures = []
          if newsletter.get("state") != "PASS":
              failures.append(f"newsletter.state={newsletter.get('state')!r}")
          if mail.get("status") != "PASS":
              failures.append(f"mail.status={mail.get('status')!r}")
          if mail.get("cleanup_safe") is not True:
              failures.append(f"mail.cleanup_safe={mail.get('cleanup_safe')!r}")
          if mail.get("processed_errors") != 0:
              failures.append(f"mail.processed_errors={mail.get('processed_errors')!r}")
          if jobs.get("fully_accounted") is not True:
              failures.append(f"jobs.fully_accounted={jobs.get('fully_accounted')!r}")
          if runtime_exit != 0:
              failures.append(f"runtime_exit={runtime_exit}")

          if failures:
              print("Newsletter replay UAT FAIL: " + "; ".join(failures), file=sys.stderr)
              sys.exit(1)

          print("Newsletter replay UAT PASS: isolated Newsletter runtime and Newsletter/Mail acceptance boundary passed.")
          PY
